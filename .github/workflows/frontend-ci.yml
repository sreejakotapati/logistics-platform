name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**", "docker/frontend/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "docker/frontend/**", ".github/workflows/frontend-ci.yml"]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend Lint, Types & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (reproducible)
        # Requires a committed package-lock.json. Generate once with `npm install` and commit it.
        run: |
          test -f package-lock.json || { echo "::error::package-lock.json missing — run 'npm install' locally and commit it (see docs/guides/frontend-build-verification.md)"; exit 1; }
          npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NEXT_PUBLIC_APP_ENV: ci
