# Reference tuning for the local/dev PostgreSQL 16 container.
# Applied via -c flags in docker-compose (see the postgres service `command`).
# Production values are environment-specific and managed by DevOps.

max_connections = 100
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 768MB
wal_compression = on

# Observability
log_min_duration_statement = 500     # log statements slower than 500ms
log_lock_waits = on
log_checkpoints = on

timezone = 'UTC'

# Row-Level Security is enforced per-table (see app.enable_org_rls); no server toggle required.
