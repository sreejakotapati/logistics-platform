name: Backend CI

on:
  pull_request:
    paths: ["backend/**", "database/**", "docker/backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "database/**", "docker/backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Backend Lint & Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (types)
        run: mypy app

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logistics_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/logistics_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/logistics_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare database (extensions)
        run: psql "postgresql://postgres:postgres@localhost:5432/logistics_test" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      - name: Apply migrations (validate foundation)
        run: alembic upgrade head
      - name: Unit tests with coverage
        # S1: coverage reported (warn-only). From Sprint 2 add: --cov-fail-under=80
        run: pytest -m "not integration" --cov=app --cov-report=term-missing
      - name: RLS isolation suite (integration — required)
        env:
          RLS_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/logistics_test
        run: pytest -m integration tests/integration -v
