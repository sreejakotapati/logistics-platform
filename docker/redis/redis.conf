# Redis 7 configuration — Logistics Management Platform (local/dev foundation).
# Production overrides (maxmemory, requirepass, TLS, replication) are managed by DevOps.

################################## NETWORK ####################################
bind 0.0.0.0
protected-mode no            # safe inside the isolated compose network; enable + requirepass in prod
port 6379
tcp-keepalive 300
timeout 0

################################# GENERAL #####################################
databases 16                 # platform uses DB 0 only; key namespacing is preferred over multiple DBs
loglevel notice

################################ PERSISTENCE ##################################
# AOF (durability for streams/queues/jobs) + RDB snapshots.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000
rdbcompression yes

############################### MEMORY MANAGEMENT #############################
# Dev: no cap. Cache keys rely on per-key TTLs.
# Prod (DevOps): set maxmemory; a *pure cache* instance should use allkeys-lru.
maxmemory-policy noeviction
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

############################ KEYSPACE NOTIFICATIONS ###########################
# Expired-key events (session / rate-limit expiry handling). Broaden later if a feature needs it.
notify-keyspace-events Ex

############################# CLIENT OUTPUT BUFFERS ###########################
# Pub/Sub fan-out for WebSocket scaling — generous buffer for subscribers.
client-output-buffer-limit pubsub 32mb 8mb 60

################################## SLOW LOG ###################################
slowlog-log-slower-than 10000
slowlog-max-len 128
