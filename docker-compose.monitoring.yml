# Monitoring foundation (optional overlay). Container + host metrics now;
# application metrics (FastAPI /metrics) are added in Sprint 9.
# Usage: docker compose -f docker-compose.monitoring.yml up -d
name: logistics-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: staging-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # bind to localhost; expose via proxy/VPN only
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: staging-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices: ["/dev/kmsg"]
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: staging-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: staging-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [monitoring]

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
